[package]
name = "pico2-bringup"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone firmware crate (not part of the hermes-tc6 package build) so the library's
# host-side `cargo test` never sees these embedded-only dependencies.

[lib]
test = false
bench = false
harness = false

[[bin]]
name = "pico2-bringup"
test = false
bench = false

# On-target tests (embedded-test + probe-rs): `cargo test`
[[test]]
name = "single_board"
harness = false

[[test]]
name = "two_board"
harness = false

[[test]]
name = "wiring_probe"
harness = false

[[test]]
name = "frames"
harness = false

[dependencies]
hermes-tc6 = { path = "../..", features = ["defmt"] }
heapless = "0.9.3"

cortex-m = "0.7"
cortex-m-rt = "0.7"
rp235x-hal = { version = "0.4.0", features = ["rt", "critical-section-impl", "defmt"] }
embedded-hal = "1.0.0"
embedded-hal-bus = "0.3.0"

defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }

[profile.dev]
opt-level = "s"
codegen-units = 1
debug = 2

[profile.release]
opt-level = "s"
codegen-units = 1
lto = "fat"
debug = 2

[dev-dependencies]
embedded-test = { version = "0.7.3", features = ["defmt"] }
# For the `phy::Device` trait the frame tests drive. Same minimal feature set as the library.
smoltcp = { version = "0.13.1", default-features = false, features = ["medium-ethernet", "proto-ipv4", "socket-udp"] }
