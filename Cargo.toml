[package]
name = "hermes-tc6"
version = "0.1.0"
edition = "2024"

[features]
default = ["embedded-hal"]
# `EmbeddedHalImplementation` - the ready-made `Tc6Interface` built on a blocking
# `embedded-hal` `SpiDevice`. On by default; turn it off (`default-features = false`)
# if you only ever use your own `Tc6Interface` impl (e.g. a DMA transport) and would
# rather not pull in `embedded-hal`.
embedded-hal = ["dep:embedded-hal"]
# Route this crate's internal logging to `defmt` or to the `log` facade. Enable at
# most one; turning on both is a compile error (see `src/fmt.rs`). With neither, the
# log macros expand to nothing and the crate stays dependency-free here.
#
# These only wire up *this* crate. smoltcp has its own mutually-exclusive
# `log` / `defmt` features (and `log` is on by its defaults) - configure that in
# the application crate if you want smoltcp's own tracing on the same backend.
#
# Note: `cargo test --features defmt` will not link (no defmt global logger in a
# host binary); the host test suite runs with no logging, or with `--features log`.
defmt = ["dep:defmt"]
log = ["dep:log"]

[dev-dependencies]
fake_tc6 = { path = "fake_tc6" }

[dependencies]
embedded-dma = "0.2.0"
embedded-hal = { version = "1.0.0", optional = true }
# Only `heapless::Vec` is used (receive-path scratch); frame storage is bbqueue.
heapless = "0.9.3"
# no default features: the defaults pull in `std` (and `log`), which breaks no_std targets.
# The driver only needs `phy::Device` + `Medium::Ethernet` (which drags in `socket`, and that
# requires at least one socket kind, hence `socket-udp`); apps enable the rest themselves.
smoltcp = { version = "0.13.1", default-features = false, features = ["medium-ethernet", "proto-ipv4", "socket-udp"] }

defmt = { version = "1", optional = true }
log = { version = "0.4", optional = true }
# Frame rings (bip buffers), one per direction, inside `HermesStorage`. The driver uses the
# lock-free CAS coordination (`AtomicCoord`), which bbqueue enables on any target with pointer-
# width CAS (e.g. thumbv7m/thumbv8m). Default features (maitake-sync, critical-section) are not
# needed. Cortex-M0 (no CAS) would need bbqueue's `critical-section` coordination - not wired up.
bbqueue = { version = "0.7", default-features = false }
